<!DOCTYPE html>
<html>
<head>
    <title>Gomez Games - Flappy Bird</title>
    <style>
        body { margin:0; overflow:hidden; background:#70c5ce; }
        canvas { display:block; margin:0 auto; background:#70c5ce; }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 320;
canvas.height = 480;

let bird = { x:50, y:240, w:20, h:20, dy:0 };
let gravity = 0.6;
let jump = -10;
let pipes = [];
let frame = 0;
let score = 0;

// Jump on click/tap
document.addEventListener('click', ()=> { bird.dy = jump; });

function spawnPipe() {
    let top = Math.random() * 200 + 50;
    pipes.push({ x:320, top:top, bottom:top+120 });
}

function update() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Bird
    bird.dy += gravity;
    bird.y += bird.dy;
    ctx.fillStyle="yellow";
    ctx.fillRect(bird.x, bird.y, bird.w, bird.h);

    // Pipes
    if(frame % 100 === 0) spawnPipe();
    for(let i=0;i<pipes.length;i++){
        let p=pipes[i];
        p.x-=2;
        ctx.fillStyle="green";
        ctx.fillRect(p.x,0,30,p.top);
        ctx.fillRect(p.x,p.bottom,30,canvas.height-p.bottom);

        // Collision
        if(bird.x+bird.w>p.x && bird.x<p.x+30 && (bird.y<p.top || bird.y+bird.h>p.bottom)){
            bird.y=240; bird.dy=0; score=0; pipes=[]; // reset
        }

        if(p.x + 30 === bird.x) score++;
    }

    // Score
    ctx.fillStyle="white";
    ctx.font="20px Arial";
    ctx.fillText("Score: "+score, 10, 30);

    frame++;
    requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
